<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Choice Clash — Would You Rather, Truth or Dare & Riddles</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf9fb; --card:#ffffff; --text:#0f172a; --muted:#64748b;
  --accent:#bd3193; --accent-soft:rgba(189,49,147,.14);
  --accent2:#0891b2; --accent2-soft:rgba(8,145,178,.14);
  --border:rgba(15,23,42,.07);
  --grad:linear-gradient(135deg,#bd3193 0%,#e0457a 45%,#0891b2 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Red Hat Display','Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
}
.app{
  max-width:480px;margin:0 auto;height:100%;position:relative;
  display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(189,49,147,.10), transparent 60%),
    radial-gradient(100% 50% at 100% 110%, rgba(8,145,178,.10), transparent 60%),
    var(--bg);
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:20px 20px 28px;overflow-y:auto;transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .3s;}
.screen.hidden{display:none}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
html[dir="rtl"] .mirror{transform:scaleX(-1)}
html[dir="rtl"] .brand h1{letter-spacing:0}

.brand{text-align:center;margin-top:10px}
.brand .logo{width:68px;height:68px;margin:0 auto 12px;border-radius:22px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(189,49,147,.35)}
.brand h1{font-size:32px;font-weight:900;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.brand p{color:var(--muted);margin-top:8px;font-size:14px;font-weight:600}
.pill-row{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.pill-toggle{display:flex;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.pill-toggle button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-family:inherit;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer;transition:all .2s}
.pill-toggle button.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(189,49,147,.35)}
.modes{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.mode-card{
  display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:16px;cursor:pointer;transition:transform .15s,box-shadow .2s;
  box-shadow:0 1px 3px rgba(0,0,0,.05);position:relative;overflow:hidden;
}
.mode-card:active{transform:scale(.97)}
.mode-card .ic{width:50px;height:50px;flex:0 0 50px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.mode-card .ic.a{background:var(--accent-soft);color:var(--accent)}
.mode-card .ic.b{background:var(--accent2-soft);color:var(--accent2)}
.mode-card .ic.c{background:rgba(217,119,6,.12);color:#d97706}
.mode-card h3{font-size:18px;font-weight:800}
.mode-card p{font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:600}
.mode-card .chev{margin-left:auto;color:var(--muted);flex:0 0 auto}
html[dir="rtl"] .mode-card .chev{margin-left:0;margin-right:auto}
.home-actions{display:flex;gap:12px;margin-top:14px}
.home-actions button{flex:1;padding:13px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-family:inherit;font-weight:800;font-size:13.5px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.home-actions button:active{transform:scale(.97)}
.stats-line{text-align:center;color:var(--muted);font-size:12px;font-weight:600;margin-top:16px}
.stats-line b{color:var(--accent)}

.game-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex:0 0 auto}
.icon-btn{width:40px;height:40px;border-radius:14px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex:0 0 40px}
.icon-btn:active{transform:scale(.93)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.mode-title{flex:1;text-align:center;min-width:0}
.mode-title .kicker{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.mode-title h2{font-size:17px;font-weight:800;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter{font-size:12.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:6px 11px;border-radius:999px;white-space:nowrap}

.wyr-q{text-align:center;font-size:14px;font-weight:700;color:var(--muted);margin:4px 0 14px;text-transform:uppercase;letter-spacing:1px}
.wyr-opts{position:relative;display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center}
.wyr-opt{
  position:relative;border:2px solid var(--border);background:var(--card);border-radius:22px;
  padding:24px 18px;cursor:pointer;min-height:120px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:18px;font-weight:800;line-height:1.35;overflow:hidden;transition:transform .15s,border-color .2s;
}
.wyr-opt:active{transform:scale(.98)}
.wyr-opt.a{border-color:transparent;background:linear-gradient(135deg,#fff,#fff) padding-box, var(--grad) border-box}
.wyr-opt .bar{position:absolute;left:0;top:0;bottom:0;width:0%;transition:width 1s cubic-bezier(.22,1,.36,1);z-index:0}
.wyr-opt.a .bar{background:var(--accent-soft)}
.wyr-opt.b .bar{background:var(--accent2-soft)}
.wyr-opt .txt{position:relative;z-index:1}
.wyr-opt .pct{position:absolute;right:14px;bottom:10px;font-size:20px;font-weight:900;z-index:1;opacity:0;transition:opacity .4s}
html[dir="rtl"] .wyr-opt .pct{right:auto;left:14px}
.wyr-opt.a .pct{color:var(--accent)}
.wyr-opt.b .pct{color:var(--accent2)}
.wyr-opt.voted{cursor:default}
.wyr-opt.voted .pct{opacity:1}
.or-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.wyr-wrap{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center}

.td-buttons{display:flex;gap:14px;margin-bottom:16px;flex:0 0 auto}
.td-buttons button{flex:1;padding:18px;border-radius:20px;border:0;font-family:inherit;font-size:17px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.15);transition:transform .15s}
.td-buttons button:active{transform:scale(.96)}
.td-buttons .truth{background:linear-gradient(135deg,#bd3193,#e0457a)}
.td-buttons .dare{background:linear-gradient(135deg,#0891b2,#0ea5c9)}
.flip-card{perspective:1200px;flex:1;min-height:220px}
.flip-inner{position:relative;width:100%;height:100%;min-height:220px;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;background:var(--card);border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.flip-face.back{transform:rotateY(180deg)}
.flip-face .tag{font-size:10.5px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;padding:6px 14px;border-radius:999px}
.flip-face .tag.t{background:var(--accent-soft);color:var(--accent)}
.flip-face .tag.d{background:var(--accent2-soft);color:var(--accent2)}
.flip-face .tag.r{background:rgba(217,119,6,.14);color:#d97706}
.flip-face .content{font-size:20px;font-weight:800;line-height:1.4}
.flip-face .hint{font-size:14.5px;color:var(--muted);font-weight:600;margin-top:14px;font-style:italic}
.flip-face .answer{font-size:23px;font-weight:900;color:var(--accent);margin-top:10px}
.flip-face .placeholder{color:var(--muted);font-weight:600;font-size:15px;padding:0 20px;line-height:1.5}

.game-actions{display:flex;gap:12px;margin-top:16px;flex:0 0 auto}
.btn{flex:1;padding:15px;border-radius:18px;border:0;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;transition:transform .15s;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(189,49,147,.35)}
.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn:disabled{opacity:.4;cursor:default}

.overlay{position:absolute;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .25s}
.overlay.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);border-radius:26px;padding:26px 22px;width:100%;max-width:380px;max-height:85%;overflow-y:auto;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.sheet h3{font-size:21px;font-weight:900;text-align:center}
.sheet .sub{text-align:center;color:var(--muted);font-size:13.5px;margin-top:6px;font-weight:500}
.big-stat{display:flex;justify-content:center;gap:22px;margin:20px 0}
.big-stat div{text-align:center}
.big-stat .n{font-size:32px;font-weight:900;color:var(--accent)}
.big-stat .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.sheet .btn{margin-top:10px}
.saved-item{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid var(--border);border-radius:14px;margin-top:10px;background:var(--bg)}
.saved-item .badge{font-size:9.5px;font-weight:900;padding:4px 7px;border-radius:999px;flex:0 0 auto;text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.saved-item .badge.wyr{background:var(--accent-soft);color:var(--accent)}
.saved-item .badge.td{background:var(--accent2-soft);color:var(--accent2)}
.saved-item .badge.rid{background:rgba(217,119,6,.14);color:#d97706}
.saved-item p{font-size:13px;font-weight:600;line-height:1.45;flex:1}
.saved-item .del{border:0;background:transparent;color:var(--muted);cursor:pointer;flex:0 0 auto;padding:4px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-weight:600;font-size:13.5px;line-height:1.5}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:all .3s;z-index:99;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">

  <section id="screen-home" class="screen">
    <div class="scroll" style="display:flex;flex-direction:column;justify-content:center;min-height:100%">
      <div class="brand">
        <div class="logo">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M7 8 3 12l4 4"/><path d="m17 8 4 4-4 4"/></svg>
        </div>
        <h1>Choice Clash</h1>
        <p id="tagline"></p>
      </div>

      <div class="pill-row">
        <div class="pill-toggle" id="langToggle">
          <button data-lang="en">EN</button>
          <button data-lang="fr">FR</button>
          <button data-lang="ar">عربي</button>
        </div>
        <div class="pill-toggle" id="levelToggle">
          <button data-level="0" class="on" id="lblClean">Clean</button>
          <button data-level="1" id="lblParty">Party</button>
        </div>
      </div>

      <div class="modes">
        <div class="mode-card" data-mode="wyr">
          <div class="ic a"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M21 3l-7.5 7.5"/><path d="M3 3l7.5 7.5"/><path d="M16 21h5v-5"/><path d="M8 21H3v-5"/><path d="M21 21l-7.5-7.5"/><path d="M3 21l7.5-7.5"/></svg></div>
          <div><h3 id="lblWYR">Would You Rather</h3><p id="cnt-wyr">—</p></div>
          <svg class="chev mirror" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div class="mode-card" data-mode="td">
          <div class="ic b"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></div>
          <div><h3 id="lblTD">Truth or Dare</h3><p id="cnt-td">—</p></div>
          <svg class="chev mirror" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div class="mode-card" data-mode="rid">
          <div class="ic c"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/></svg></div>
          <div><h3 id="lblRID">Riddles</h3><p id="cnt-rid">—</p></div>
          <svg class="chev mirror" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>

      <div class="home-actions">
        <button id="btnSurprise"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg> <span id="lblSurprise">Surprise Me</span></button>
        <button id="btnSaved"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> <span id="lblSaved">Saved</span> <span id="favCount" style="color:var(--accent)">0</span></button>
      </div>
      <div class="stats-line"><b id="statAnswered">0</b> <span id="lblAnswered">answered</span> &middot; <b id="statBest">0</b> <span id="lblBest">best streak</span></div>
    </div>
  </section>

  <section id="screen-game" class="screen hidden">
    <div class="game-header">
      <button class="icon-btn" id="btnHome" aria-label="Home"><svg class="mirror" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="mode-title">
        <div class="kicker" id="modeKicker">Mode</div>
        <h2 id="modeTitle">Would You Rather</h2>
      </div>
      <div class="counter" id="counter">1</div>
      <button class="icon-btn" id="btnDone" aria-label="Finish"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
      <button class="icon-btn" id="btnFav" aria-label="Save"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></button>
      <button class="icon-btn" id="btnShare" aria-label="Share"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></button>
    </div>
    <div class="scroll" id="gameBody" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
    <div class="game-actions" id="gameActions"></div>
  </section>

  <div id="overlay-summary" class="overlay hidden">
    <div class="sheet">
      <h3 id="sumTitle">Session Complete</h3>
      <p class="sub" id="sumSub">Nice run! Here is how you did.</p>
      <div class="big-stat">
        <div><div class="n" id="sumAnswered">0</div><div class="l" id="sumL1">Answered</div></div>
        <div><div class="n" id="sumStreak">0</div><div class="l" id="sumL2">Streak</div></div>
        <div><div class="n" id="sumSaved">0</div><div class="l" id="sumL3">Saved</div></div>
      </div>
      <button class="btn primary" id="btnAgain"><svg class="mirror" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> <span id="lblAgain">Play Again</span></button>
      <button class="btn secondary" id="btnSumHome">Back to Home</button>
    </div>
  </div>

  <div id="overlay-saved" class="overlay hidden">
    <div class="sheet">
      <h3 id="savedTitle">Saved Cards</h3>
      <p class="sub" id="savedSub">Your favorite questions, all in one place.</p>
      <div id="savedList"></div>
      <button class="btn secondary" id="btnSavedClose">Close</button>
    </div>
  </div>

  <div class="toast" id="toast">Copied</div>
</div>

<script>
(function(){
"use strict";

var UI = {

var LS = {
  get:function(k){ try{ return JSON.parse(localStorage.getItem("cc_"+k)); }catch(e){ return null; } },
  set:function(k,v){ try{ localStorage.setItem("cc_"+k, JSON.stringify(v)); }catch(e){} }
};
var S = {
  lang: LS.get("lang") || (navigator.language && navigator.language.indexOf("ar")===0 ? "ar" : navigator.language && navigator.language.indexOf("fr")===0 ? "fr" : "en"),
  mode:null, level: LS.get("level")||0, deck:[], idx:0, answered:0, streak:0, bestStreak:0,
  totalAnswered: LS.get("total")||0, best: LS.get("best")||0,
  favs: LS.get("favs")||{}, votes: LS.get("votes")||{},
  current:null, voted:false, hintShown:false, flipped:false
};
function applyLang(){
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang==="ar" ? "rtl" : "ltr";
}
function $(id){ return document.getElementById(id); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=a[i]; a[i]=a[j]; a[j]=tmp; } return a; }
function hashStr(s){ var h=0; for(var i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; } return Math.abs(h); }
function L(o){ return (o && o[S.lang]) || (o && o.en) || ""; }
function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove("show"); },1800); }
function showScreen(id){ ["screen-home","screen-game"].forEach(function(s){ $(s).classList.toggle("hidden", s!==id); }); }

function renderHome(){
  $("tagline").textContent = t("tagline");
  $("lblClean").textContent = t("clean");
  $("lblParty").textContent = t("party");
  $("lblWYR").textContent = t("wyr");
  $("lblTD").textContent = t("td");
  $("lblRID").textContent = t("rid");
  $("lblSurprise").textContent = t("surprise");
  $("lblSaved").textContent = t("saved");
  $("lblAnswered").textContent = t("answered");
  $("lblBest").textContent = t("best");
  $("cnt-wyr").textContent = WYR.length + " " + t("questions");
  $("cnt-td").textContent = (TRUTH.length + DARE.length) + " " + t("prompts");
  $("cnt-rid").textContent = RIDDLES.length + " " + t("riddles");
  $("statAnswered").textContent = S.totalAnswered;
  $("statBest").textContent = S.best;
  $("favCount").textContent = Object.keys(S.favs).length;
  $("btnSavedClose").textContent = t("close");
  $("btnSumHome").textContent = t("backHome");
  document.querySelectorAll("#langToggle button").forEach(function(b){ b.classList.toggle("on", b.dataset.lang===S.lang); });
  document.querySelectorAll("#levelToggle button").forEach(function(b){ b.classList.toggle("on", parseInt(b.dataset.level,10)===S.level); });
}
document.querySelectorAll("#langToggle button").forEach(function(b){
  b.addEventListener("click", function(){ S.lang = b.dataset.lang; LS.set("lang", S.lang); applyLang(); renderHome(); });
});
document.querySelectorAll("#levelToggle button").forEach(function(b){
  b.addEventListener("click", function(){ S.level = parseInt(b.dataset.level,10); LS.set("level", S.level); renderHome(); });
});
document.querySelectorAll(".mode-card").forEach(function(c){ c.addEventListener("click", function(){ startMode(c.dataset.mode); }); });
$("btnSurprise").addEventListener("click", function(){ var m=["wyr","td","rid"]; startMode(m[Math.floor(Math.random()*3)]); });
$("btnSaved").addEventListener("click", function(){ renderSaved(); $("overlay-saved").classList.remove("hidden"); });
$("btnSavedClose").addEventListener("click", function(){ $("overlay-saved").classList.add("hidden"); });

function startMode(mode){
  S.mode = mode; S.answered = 0; S.streak = 0; S.idx = 0; S.bestStreak = 0;
  if(mode==="wyr"){ S.deck = shuffle(WYR.slice()); $("modeTitle").textContent=t("wyr"); $("modeKicker").textContent=t("pickSide"); }
  if(mode==="td"){
    S.deck = { truth: shuffle(TRUTH.filter(function(x){return x.l<=S.level;}).slice()), dare: shuffle(DARE.filter(function(x){return x.l<=S.level;}).slice()) };
    $("modeTitle").textContent=t("td"); $("modeKicker").textContent=t("chooseChallenge");
  }
  if(mode==="rid"){ S.deck = shuffle(RIDDLES.slice()); $("modeTitle").textContent=t("rid"); $("modeKicker").textContent=t("canYouSolve"); }
  showScreen("screen-game");
  nextCard();
}
function nextCard(){
  S.voted=false; S.hintShown=false; S.flipped=false;
  if(S.mode==="wyr"){ if(S.idx>=S.deck.length){ S.deck=shuffle(WYR.slice()); S.idx=0; } S.current=S.deck[S.idx++]; }
  if(S.mode==="rid"){ if(S.idx>=S.deck.length){ S.deck=shuffle(RIDDLES.slice()); S.idx=0; } S.current=S.deck[S.idx++]; }
  renderGame();
}
function renderGame(){
  $("counter").textContent = S.answered + 1;
  updateFavBtn();
  var body=$("gameBody"), actions=$("gameActions");
  body.innerHTML=""; actions.innerHTML="";
  if(S.mode==="wyr") renderWYR(body, actions);
  if(S.mode==="td") renderTD(body, actions);
  if(S.mode==="rid") renderRid(body, actions);
}
function nextArrow(){ return '<svg class="mirror" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>'; }

function renderWYR(body, actions){
  var q=S.current, id="w"+hashStr(q.en[0]+q.en[1]);
  var wrap=document.createElement("div"); wrap.className="wyr-wrap";
  wrap.innerHTML='<div class="wyr-q">'+t("wyrQ")+'</div>'+
    '<div class="wyr-opts">'+
      '<button class="wyr-opt a" data-opt="a"><div class="bar"></div><span class="txt"></span><span class="pct"></span></button>'+
      '<div class="or-badge">'+t("or")+'</div>'+
      '<button class="wyr-opt b" data-opt="b"><div class="bar"></div><span class="txt"></span><span class="pct"></span></button>'+
    '</div>';
  var opts=wrap.querySelectorAll(".wyr-opt");
  opts[0].querySelector(".txt").textContent=L(q)[0];
  opts[1].querySelector(".txt").textContent=L(q)[1];
  body.appendChild(wrap);
  var nextBtn=document.createElement("button"); nextBtn.className="btn primary"; nextBtn.disabled=true;
  nextBtn.innerHTML=t("next")+" "+nextArrow();
  actions.appendChild(nextBtn);
  function vote(opt){
    if(S.voted) return; S.voted=true; S.answered++; S.streak++;
    if(S.streak>S.bestStreak) S.bestStreak=S.streak;
    S.totalAnswered++; LS.set("total", S.totalAnswered);
    if(!S.votes[id]) S.votes[id]={a:0,b:0};
    S.votes[id][opt]++; LS.set("votes", S.votes);
    var h=hashStr(id), baseA=40+(h%160), baseB=40+((h>>3)%160);
    var ta=baseA+S.votes[id].a, tb=baseB+S.votes[id].b, tot=ta+tb;
    var pa=Math.round(ta/tot*100), pb=100-pa;
    opts.forEach(function(o){ o.classList.add("voted"); o.style.cursor="default"; });
    opts[0].querySelector(".pct").textContent=pa+"%";
    opts[1].querySelector(".pct").textContent=pb+"%";
    requestAnimationFrame(function(){
      opts[0].querySelector(".bar").style.width=pa+"%";
      opts[1].querySelector(".bar").style.width=pb+"%";
    });
    nextBtn.disabled=false;
  }
  opts[0].addEventListener("click", function(){ vote("a"); });
  opts[1].addEventListener("click", function(){ vote("b"); });
  nextBtn.addEventListener("click", function(){ maybeShowInterstitial(); nextCard(); });
}

function renderTD(body, actions){
  var btns=document.createElement("div"); btns.className="td-buttons";
  btns.innerHTML='<button class="truth">'+t("truth")+'</button><button class="dare">'+t("dare")+'</button>';
  body.appendChild(btns);
  var card=document.createElement("div"); card.className="flip-card";
  card.innerHTML='<div class="flip-inner">'+
    '<div class="flip-face front"><div class="placeholder">'+t("tdPlaceholder")+'</div></div>'+
    '<div class="flip-face back"><span class="tag" id="tdTag">'+t("truth")+'</span><div class="content" id="tdContent"></div></div>'+
  '</div>';
  body.appendChild(card);
  var doneBtn=document.createElement("button"); doneBtn.className="btn primary"; doneBtn.disabled=true;
  doneBtn.innerHTML=t("doneNext")+" "+nextArrow();
  actions.appendChild(doneBtn);
  function pick(kind){
    var arr = kind==="t" ? S.deck.truth : S.deck.dare;
    if(arr.length===0){
      arr = kind==="t" ? shuffle(TRUTH.filter(function(x){return x.l<=S.level;}).slice()) : shuffle(DARE.filter(function(x){return x.l<=S.level;}).slice());
      if(kind==="t") S.deck.truth=arr; else S.deck.dare=arr;
    }
    var item = arr.pop();
    S.current = item; S.answered++; S.streak++;
    if(S.streak>S.bestStreak) S.bestStreak=S.streak;
    S.totalAnswered++; LS.set("total", S.totalAnswered);
    $("tdTag").textContent = kind==="t" ? t("truth") : t("dare");
    $("tdTag").className = "tag " + (kind==="t"?"t":"d");
    $("tdContent").textContent = L(item);
    card.classList.add("flipped");
    doneBtn.disabled=false;
    $("counter").textContent = S.answered + 1;
    updateFavBtn();
  }
  btns.querySelector(".truth").addEventListener("click", function(){ pick("t"); });
  btns.querySelector(".dare").addEventListener("click", function(){ pick("d"); });
  doneBtn.addEventListener("click", function(){
    maybeShowInterstitial();
    card.classList.remove("flipped");
    doneBtn.disabled=true;
    $("counter").textContent = S.answered + 1;
    updateFavBtn();
  });
}

function renderRid(body, actions){
  var r=S.current;
  var card=document.createElement("div"); card.className="flip-card";
  card.innerHTML='<div class="flip-inner">'+
    '<div class="flip-face front"><span class="tag r">'+t("riddle")+'</span><div class="content" id="ridQ"></div><div class="hint" id="ridHint" style="display:none"></div></div>'+
    '<div class="flip-face back"><span class="tag r">'+t("answer")+'</span><div class="answer" id="ridA"></div></div>'+
  '</div>';
  body.appendChild(card);
  $("ridQ").textContent = L(r.q);
  var hintBtn=document.createElement("button"); hintBtn.className="btn secondary";
  hintBtn.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/></svg> '+t("hint");
  var revealBtn=document.createElement("button"); revealBtn.className="btn primary"; revealBtn.textContent=t("reveal");
  var nextBtn=document.createElement("button"); nextBtn.className="btn primary";
  nextBtn.innerHTML=t("next")+" "+nextArrow();
  actions.appendChild(hintBtn); actions.appendChild(revealBtn);
  hintBtn.addEventListener("click", function(){
    showRewarded(function(){
      $("ridHint").style.display="block";
      $("ridHint").textContent = t("hint")+": "+L(r.h);
      hintBtn.disabled=true; hintBtn.textContent=t("hintShown");
    });
  });
  revealBtn.addEventListener("click", function(){
    if(!S.flipped){ S.flipped=true; S.answered++; S.streak++; if(S.streak>S.bestStreak) S.bestStreak=S.streak; S.totalAnswered++; LS.set("total", S.totalAnswered); }
    $("ridA").textContent = L(r.a);
    card.classList.add("flipped");
    revealBtn.style.display="none"; hintBtn.style.display="none";
    actions.appendChild(nextBtn);
    $("counter").textContent = S.answered + 1;
    updateFavBtn();
  });
  nextBtn.addEventListener("click", function(){ maybeShowInterstitial(); nextCard(); });
}

function currentKey(){
  if(!S.current) return null;
  if(S.mode==="wyr") return "w"+hashStr(S.current.en[0]+S.current.en[1]);
  if(S.mode==="td") return "t"+hashStr(S.current.en);
  if(S.mode==="rid") return "r"+hashStr(S.current.q.en);
  return null;
}
function currentText(){
  if(!S.current) return "";
  if(S.mode==="wyr"){ var o=L(S.current); return t("wyr")+": "+o[0]+" / "+o[1]; }
  if(S.mode==="td") return t("td")+": "+L(S.current);
  if(S.mode==="rid") return L(S.current.q)+" — "+L(S.current.a);
  return "";
}
function updateFavBtn(){ var k=currentKey(); $("btnFav").classList.toggle("on", !!(k && S.favs[k])); }
$("btnFav").addEventListener("click", function(){
  var k=currentKey(); if(!k) return;
  if(S.favs[k]){ delete S.favs[k]; toast(t("removedToast")); }
  else { S.favs[k]={mode:S.mode, text:currentText()}; toast(t("savedToast")); }
  LS.set("favs", S.favs);
  $("favCount").textContent = Object.keys(S.favs).length;
  updateFavBtn();
});
function renderSaved(){
  $("savedTitle").textContent=t("savedTitle"); $("savedSub").textContent=t("savedSub");
  var list=$("savedList"); list.innerHTML="";
  var keys=Object.keys(S.favs);
  if(keys.length===0){ list.innerHTML='<div class="empty">'+t("savedEmpty")+'</div>'; return; }
  keys.forEach(function(k){
    var f=S.favs[k];
    var row=document.createElement("div"); row.className="saved-item";
    var badge=document.createElement("span"); badge.className="badge "+(f.mode==="wyr"?"wyr":f.mode==="td"?"td":"rid");
    badge.textContent = f.mode==="wyr"?"WYR":f.mode==="td"?"T/D":"?";
    var p=document.createElement("p"); p.textContent=f.text;
    var del=document.createElement("button"); del.className="del"; del.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    del.addEventListener("click", function(){ delete S.favs[k]; LS.set("favs", S.favs); $("favCount").textContent=Object.keys(S.favs).length; renderSaved(); });
    row.appendChild(badge); row.appendChild(p); row.appendChild(del);
    list.appendChild(row);
  });
}

$("btnShare").addEventListener("click", function(){
  var text = currentText() + "\n\n— Choice Clash";
  if(navigator.share){ navigator.share({text:text}).catch(function(){}); }
  else {
    var ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(t("copied")); }catch(e){ toast(t("copyFailed")); }
    document.body.removeChild(ta);
  }
});
$("btnHome").addEventListener("click", function(){ endSession(false); });
$("btnDone").addEventListener("click", function(){ endSession(true); });
function endSession(showSummary){
  if(S.bestStreak > S.best){ S.best = S.bestStreak; LS.set("best", S.best); }
  if(showSummary && S.mode){
    $("sumTitle").textContent=t("sessionComplete");
    $("sumSub").textContent=t("sessionSub");
    $("sumL1").textContent=t("lAnswered"); $("sumL2").textContent=t("lStreak"); $("sumL3").textContent=t("lSaved");
    $("lblAgain").textContent=t("playAgain");
    $("sumAnswered").textContent=S.answered; $("sumStreak").textContent=S.bestStreak; $("sumSaved").textContent=Object.keys(S.favs).length;
    $("overlay-summary").classList.remove("hidden");
  } else {
    showScreen("screen-home"); renderHome();
  }
}
$("btnAgain").addEventListener("click", function(){ $("overlay-summary").classList.add("hidden"); startMode(S.mode); });
$("btnSumHome").addEventListener("click", function(){ $("overlay-summary").classList.add("hidden"); showScreen("screen-home"); renderHome(); });

applyLang();
renderHome();
showScreen("screen-home");
})();
</script>
</body>
</html>
